principles:
- name: Visibility
  description: Track the f1Connect subscription, per-case fees, and add-on products per funeral-home account.
- name: Allocation
  description: Map each AccountExternalId to a funeral-home cost center; the partner Cases API is not separately metered.
- name: Optimization
  description: Right-size add-ons (webcasting, e-commerce) to actual family demand; consolidate multi-location homes under negotiated terms.
- name: Accountability
  description: Assign an owner per account; review the monthly f1Connect invoice against call volume and add-on usage.
