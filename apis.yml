name: funeralOne
kind: company
description: >-
  funeralOne is a funeral-home technology company whose f1Connect platform
  delivers funeral-home websites, memorial/tribute pages, Life Tributes tribute
  videos, memorial webcasting, and e-commerce for independent funeral homes.
  funeralOne publishes a partner integration API (base https://api.funeralone.com)
  that lets funeral-management / case-management systems push deceased, obituary,
  service-event, tribute-video, and family-administration data into a funeral
  home's f1Connect account so an At-Need case automatically populates the
  memorial website and Life Tributes. The API is partner-gated - access requires
  an API key issued by a funeralOne engineer and per-customer AccountExternalId
  associations - and uses HTTP Basic authentication. Only the Cases resource is
  publicly documented; the broader website, e-commerce, and webcasting products
  are delivered through the f1Connect platform rather than a public API.
