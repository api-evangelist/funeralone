description: >-
  FinOps view of funeralOne spend. funeralOne bills funeral homes on a per-home
  subscription basis for the f1Connect website platform (commonly reported
  around $245-$495/month plus per-case fees), with Life Tributes tribute-video
  software, memorial webcasting, and e-commerce sold as add-on products. The
  partner Cases API carries no separately published fee - it is an integration
  benefit of the f1Connect platform - so for an integration partner the API
  itself is not a metered cost line; the cost sits with the funeral-home
  customer's f1Connect subscription and add-ons.
notes: >-
  Per-unit rates are not reconciled; f1Connect and Life Tributes pricing is
  quote-based - verify with funeralOne sales. Figures are modeled from
  third-party pricing summaries and the funeralOne site.
