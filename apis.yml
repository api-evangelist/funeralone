apis:
- aid: funeralone:funeralone-cases-api
  name: funeralOne Cases API
  tags:
  - Cases
  - Obituaries
  - Events
  - Tribute Videos
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.funeralone.com/docs/
  baseURL: https://api.funeralone.com
  properties:
  - url: https://api.funeralone.com/docs/
    type: Documentation
  - url: https://api.funeralone.com/docs/
    type: APIReference
  - url: openapi/funeralone-openapi.yml
    type: OpenAPI
  - url: collections/funeralone.postman_collection.json
    type: PostmanCollection
  description: >-
    Partner integration surface for pushing funeral-case data into a funeral
    home's f1Connect account. A Case carries the deceased's identity and
    obituary, an optional Base64 photo, serving-location and family-address
    details, cemetery coordinates, a typed Events array (Visitation, Service,
    Shiva, Cemetery), ExternalVideoUrls (Tribute and Webcast videos, e.g.
    videos.lifetributes.com), and FamilyAdmins email invitations. Creating or
    updating a case (POST /cases) automatically surfaces the deceased in the
    memorial website and Life Tributes. Endpoints are keyed by an immutable
    AccountExternalId (per funeral-home customer) and CaseExternalId, and
    authenticated with HTTP Basic using a funeralOne-issued API key.
